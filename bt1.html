<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trang Giới Thiệu Tương Tác</title>
        <style>
            body {
            font-family: Arial,sans-serif;
            margin: 0;
            text-align: center; 
            transition: 0.3s; 
            }
            header, footer {
            background: #333;
            color: white;
            padding: 15px;
            }
            nav {
            background: #ddd;
            padding: 10px;
            }
            main {
            padding: 50px;
            min-height: 200px;
            }
            button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px; 
            }
        </style>
    </head>
    <body>

        <header>
            <h1>Trang Giới Tương Tác</h1>
        </header>

        <nav>
            <a href="#">Trang chủ</a> | <a href="#">Giới thiệu</a> | <a href="#">Liên hệ</a>
        </nav>

        <main>
            <h2 id="loi-chao">Đang tải lời chào...</h2>
            <p>Đây là trang cá nhân tương tác cơ bản.</p>

            <button id="nut-doi-mau">Đổi màu nền</button>
        </main>

        <footer>
            <p>Bản quyền © 2026</p>
        </footer>

        <script>
            const theLoiChao = document.getElementById("loi-chao");
            const gioHienTai = new Date().getHours();

            if (gioHienTai >= 5 && gioHienTai < 12) {
                theLoiChao.innerText = "Chào buổi sáng!";
            } else if (gioHienTai >= 12 && gioHienTai < 18) {
                theLoiChao.innerText = "Chào buổi chiều!";
            } else {
                theLoiChao.innerText = "Chào buổi tối!";
            }

            const nutDoiMau = document.getElementById("nut-doi-mau");
            let laMauToi = false; 

            nutDoiMau.addEventListener("click", function() {
                if (laMauToi === false) {
                    document.body.style.backgroundColor = "#2c3e50"; 
                    document.body.style.color = "white";           
                    laMauToi = true;
                } else {
                    document.body.style.backgroundColor = "white"; 
                    document.body.style.color = "black";        
                    laMauToi = false;
                }
            });
        </script>

    </body>
</html>
