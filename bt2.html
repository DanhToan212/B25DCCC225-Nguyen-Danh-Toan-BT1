<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính</title>
    <style>
        :root {
            font-family: "Trebuchet MS", Arial, sans-serif;
            color: #17202a;
            background: #e8f0f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: linear-gradient(135deg, #dce9e8, #f7efe3);
        }

        .calculator {
            width: min(92vw, 360px);
            padding: 24px;
            border: 1px solid rgba(23, 32, 42, 0.12);
            border-radius: 18px;
            background: #fffdf9;
            box-shadow: 0 18px 45px rgba(23, 32, 42, 0.16);
        }

        h1 {
            margin: 0 0 16px;
            color: #315d63;
            font-size: 1.35rem;
            letter-spacing: 0.04em;
            text-align: center;
        }

        .display {
            min-height: 72px;
            overflow: auto;
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 10px;
            color: #f7fbf9;
            background: #1c2d35;
            font-size: 2rem;
            text-align: right;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            min-height: 54px;
            border: 0;
            border-radius: 10px;
            color: #17202a;
            background: #e6eeee;
            cursor: pointer;
            font: inherit;
            font-size: 1.2rem;
            transition: transform 120ms ease, filter 120ms ease;
        }

        button:hover {
            filter: brightness(0.95);
        }

        button:active {
            transform: scale(0.96);
        }

        .operator {
            color: #fffdf9;
            background: #d17a45;
        }

        .clear {
            color: #fffdf9;
            background: #b64d4d;
        }

        .equals {
            color: #fffdf9;
            background: #315d63;
        }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>Máy tính</h1>
        <div id="display" class="display" aria-live="polite">0</div>
        <div class="buttons">
            <button class="clear" data-action="clear">Clear</button>
            <button class="operator" data-value="/">/</button>
            <button class="operator" data-value="*">x</button>
            <button class="operator" data-value="-">-</button>
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="+">+</button>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="equals" data-action="calculate">=</button>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="0">0</button>
        </div>
    </main>

    <script>
        const display = document.getElementById("display");
        const buttons = document.querySelectorAll("button");

        buttons.forEach((button) => {
            button.addEventListener("click", () => {
                const action = button.dataset.action;

                if (action === "clear") {
                    display.innerText = "0";
                    return;
                }

                if (action === "calculate") {
                    try {
                        const result = Function(`"use strict"; return (${display.innerText})`)();
                        display.innerText = Number.isFinite(result) ? String(result) : "Lỗi";
                    } catch {
                        display.innerText = "Lỗi";
                    }
                    return;
                }

                display.innerText = display.innerText === "0" || display.innerText === "Lỗi"
                    ? button.dataset.value
                    : display.innerText + button.dataset.value;
            });
        });
    </script>
</body>
</html>
